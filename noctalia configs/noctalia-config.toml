[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "%I:%M %p"

[widget.control-center]
glyph = "snowflake"

[widget.launcher]
glyph = "apps-filled"

[widget.media]
album_art_only = true

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
show_label = false

[widget.nix-monitor]
color = "primary"
icon_color = "primary"
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_color = "primary"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
anchor = true

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.weather]
show_condition = false

[widget.workspaces]
hide_when_empty = true
