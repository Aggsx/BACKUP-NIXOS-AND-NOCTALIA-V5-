[accessibility]
ui_scale = 0.95000000670552254

[audio]
backend = "pipewire"
device = "@DEFAULT_AUDIO_SINK@"
enable_overdrive = true

[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar.default]
background_opacity = 0.90999997965991497
border = "primary"
capsule = true
capsule_opacity = 0.0
capsule_padding = 4.0
capsule_radius = 0
center = [ "clock", "weather" ]
color = "primary"
end = [
    "w-engine-widget",
    "mpvpaper",
    "nix-monitor",
    "recorder",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
font_family = "CozetteVector"
margin_edge = 3
margin_opposite_edge = 1
radius = 0
shadow = false
start = [ "launcher", "workspaces", "media" ]

[config]

[dock]
auto_hide = true
radius = 10
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 10
reserve_space = false

[launcher]
scan_paths = [
    "/run/current-system/sw/share/applications",
    "/home/axelnixos/.local/share/applications",
    "/home/axelnixos/.nix-profile/share/applications"
]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
background_opacity = 0.90999997965991497

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "sudo nix flake update --flake /etc/nixos && sudo nixos-rebuild switch --flake /etc/nixos"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/axelnixos/Imágenes/wallpapers"

[plugin_settings."noctalia/screen_recorder"]
directory = "~/Vídeos/Recordings"
quality = "ultra"
video_source = "focused"

[plugins]
enabled = [ "avivbintangaringga/nix-monitor", "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/axelnixos/Imágenes/logo.png"
corner_radius_scale = 0.0
font_family = "CozetteVector"
lang = "es"
password_style = "random"
polkit_agent = true
umbriel_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    categories = false

    [shell.panel]
    transparency_mode = "soft"

    [shell.shadow]
    alpha = 0.99999997764825821
    direction = "down_right"

[templates.cava]
input_path = "~/.config/noctalia/templates/cava"
output_path = "~/.config/cava/themes/noctalia"
post_hook = "pkill -SIGUSR2 cava"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Storm"
custom_palette = "1381912-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [
        "btop",
        "cava",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "kcolorscheme",
        "kitty",
        "mango",
        "niri",
        "qt",
        "starship",
        "sway",
        "umbriel"
    ]
    community_ids = [ "opencode", "brave", "pywalfox-beta4", "discord", "heroiclauncher", "steam", "obs", "papirus-icons", "yazi" ]

        [theme.templates.user.cliamp]
        input_path = "~/.config/noctalia/templates/cliamp.toml"
        output_path = "~/.config/cliamp/themes/noctalia.toml"
        post_hook = "cliamp theme noctalia"

        [theme.templates.user.firefox-website-colors]
        input_path = "~/.config/matugen/templates/firefox-colors.css"
        output_path = "/home/axelnixos/.config/librewolf/librewolf/btdgf90m.default/chrome/colors.css"

        [theme.templates.user.flow]
        input_path = "~/.config/noctalia/templates/flow.toml"
        output_path = "~/.config/flow/themes/dynamic.toml"
        post_hook = " "

        [theme.templates.user.noctalia-papirus]
        input_path = "~/.config/noctalia/templates/Noctalia-Papirus.sh"
        output_path = "~/.cache/noctalia/Noctalia-Papirus-apply.sh"
        post_hook = "bash ~/.cache/noctalia/Noctalia-Papirus-apply.sh"

        [theme.templates.user.pywalfox]
        input_path = "~/.config/matugen/templates/pywalfox-colors.json"
        output_path = "~/.cache/wal/colors.json"
        post_hook = "pywalfox update"

        [theme.templates.user.rmpc]
        input_path = "~/.config/noctalia/templates/rmpc-theme.ron"
        output_path = "~/.config/rmpc/themes/current.ron"
        post_hook = "/home/axelnixos/.config/noctalia/scripts/refresh_rmpc.sh"

        [theme.templates.user.sway-noctalia]
        input_path = "~/.config/noctalia/templates/sway-noctalia"
        output_path = "~/.config/sway/noctalia"
        post_hook = "swaymsg reload"

        [theme.templates.user.vesktop]
        input_path = "~/.config/noctalia/templates/discord.css"
        output_path = "~/.config/vesktop/themes/noctalia.theme.css"

[wallpaper]
directory = "/home/axelnixos/Imágenes/wallpapers"
