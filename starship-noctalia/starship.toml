"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true
command_timeout = 100

# ==================================================
# FORMATO PRINCIPAL (Corregido el llamado al Kernel)
# ==================================================
format = "[┌─](fg:outline) $username$directory$time${env_var.OS_KERNEL}$git_branch$git_status$nodejs$python$c$rust$java$golang$ruby$php\n[└─](fg:outline) $character"

# ==================================================
# BLOQUES BÁSICOS
# ==================================================
[username]
show_always = true
style_user = "bg:surface_variant fg:primary"
style_root = "bg:error fg:on_error"
format = '[ $user ]($style) '
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bg:primary fg:on_primary bold"
read_only = ' 󰌾'
read_only_style = "bg:primary fg:error"
format = '[ $path$read_only ]($style)  ' 

[time]
disabled = false
time_format = "%H:%M"
style = "fg:primary bold"
format = '[$time]($style)  ' 

[env_var.OS_KERNEL]
variable = "OS_KERNEL"
style = "bg:primary fg:on_primary bold"
format = '[ $env_value ]($style) '

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol   = "[❯](bold fg:error)"

# ==================================================
# GIT
# ==================================================
[git_branch]
style = "bg:tertiary fg:on_tertiary"
format = '[ $symbol$branch ]($style) '

[git_status]
style = "bg:tertiary fg:on_tertiary"
format = '([$all_status$ahead_behind]($style) )'

# ==================================================
# ENTORNOS Y LENGUAJES
# ==================================================
[nodejs]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[python]
style = "bg:primary fg:on_primary"
format = '[ ${symbol}${pyenv_prefix}(${version} )]($style) '

[java]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[c]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[rust]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[golang]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

