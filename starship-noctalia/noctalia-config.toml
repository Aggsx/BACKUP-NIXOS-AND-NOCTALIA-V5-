[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "%I:%M %p"

[widget.control-center]
glyph = "snowflake"

[widget.launcher]
glyph = "apps-filled"

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.tray]
anchor = true

[widget.weather]
show_condition = false

[widget.workspaces]
hide_when_empty = true
